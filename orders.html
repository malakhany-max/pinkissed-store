<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders - Pinkissed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="Logo22.png" type="image/png">
  <link rel="apple-touch-icon" href="Logo22.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .orders-page{ max-width:700px; margin:0 auto; padding:20px; }
    .order-card{ background:#fff; border-radius:20px; padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
    .order-card h4{ color:var(--pink4); margin-bottom:8px; }
    .order-card .order-meta{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; font-size:0.9rem; }
    .order-card .order-items{ border-top:1px solid var(--border); padding-top:12px; margin-top:8px; }
    .order-card .order-items span{ display:inline-block; background:var(--bg-soft); padding:4px 10px; border-radius:8px; margin:3px; font-size:0.85rem; }
    .status-badge{ display:inline-block; padding:4px 12px; border-radius:999px; font-weight:700; font-size:0.8rem; }
    .status-badge.pending{ background:#fff3cd; color:#856404; }
    .status-badge.shipped{ background:#d1ecf1; color:#0c5460; }
    .status-badge.delivered{ background:#d4edda; color:#155724; }
    .status-badge.cancelled{ background:#f8d7da; color:#721c24; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <img src="Logo2.png" alt="Pinkissed Logo">
        <div>
          <h1>Pinkissed</h1>
          <p>Made To Match You</p>
        </div>
      </a>
      <div class="nav-actions">
        <button id="auth-btn" class="auth-btn">Login</button>
        <button id="cart-btn" class="cart-btn-nav" onclick="window.location.href='cart.html'">🛒 <span class="cart-count">0</span></button>
      </div>
      <button id="menu-toggle" class="menu-toggle">☰</button>
      <nav class="nav-links" id="nav-links">
        <button class="close-menu-btn" id="close-menu-btn">✕</button>
        <a href="index.html">Main Page</a>
        <a href="products.html">Products</a>
        <a href="orders.html">My Orders</a>
        <a href="product-care.html">Product Care</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:30px;">
    <div class="orders-page">
      <div id="orders-content"></div>
    </div>
  </main>

  <div id="auth-modal" class="modal">
    <div class="modal-content auth-modal-content">
      <div class="modal-header">
        <h3 id="auth-modal-title">Login</h3>
        <button id="close-auth" class="close-modal">×</button>
      </div>
      <form id="auth-form" class="auth-form">
        <input type="text" id="auth-name" placeholder="Full Name">
        <input type="email" id="auth-email" placeholder="Email" required>
        <input type="tel" id="auth-phone" placeholder="Phone Number">
        <input type="password" id="auth-password" placeholder="Password" required>
        <button type="submit" class="btn primary" id="auth-submit">Login</button>
      </form>
      <p id="auth-message" class="message"></p>
      <p class="auth-switch">
        <span id="auth-switch-text">Don't have an account?</span>
        <button type="button" id="auth-switch-btn">Sign Up</button>
      </p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    async function loadMyOrders() {
      const c = document.getElementById('orders-content');
      if (!currentUser?.id) {
        c.innerHTML = '<div style="text-align:center;padding:60px 20px;"><h3 style="color:var(--pink4);">Please login to view your orders</h3><p style="color:#a37588;margin:12px 0;">Log in to see your order history.</p><button class="btn primary" onclick="window.location.href=\'index.html\'">Go to Home</button></div>';
        return;
      }
      try {
        const res = await fetch(`${API_URL}/api/orders/my`, { credentials: 'include' });
        if (res.status === 401) {
          currentUser = null; localStorage.removeItem('user');
          c.innerHTML = '<div style="text-align:center;padding:60px 20px;"><h3 style="color:var(--pink4);">Session expired</h3><p style="color:#a37588;margin:12px 0;">Please login again.</p><button class="btn primary" onclick="window.location.href=\'index.html\'">Go to Home</button></div>';
          return;
        }
        const orders = await res.json();
        if (!orders.length) {
          c.innerHTML = '<div style="text-align:center;padding:60px 20px;"><h3 style="color:var(--pink4);">No orders yet</h3><p style="color:#a37588;margin:12px 0;">Start shopping to see your orders here.</p><a href="products.html" class="btn primary">Browse Products</a></div>';
          return;
        }
        c.innerHTML = '<h2 style="color:var(--pink4);margin-bottom:20px;">My Orders</h2>';
        orders.forEach(o => {
          let items = '';
          try {
            const arr = typeof o.items === 'string' ? JSON.parse(o.items) : o.items;
            if (Array.isArray(arr)) items = arr.map(i => `<span>${i.product_name || i.name || 'Item'} × ${i.quantity || 1}</span>`).join('');
          } catch {}
          const total = (o.total_price || 0) + (o.shipping_cost || 0);
          const date = new Date(o.created_at).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
          const sc = o.status || 'pending';
          c.innerHTML += `<div class="order-card"><h4>Order #${o.id}</h4><div class="order-meta"><span>📅 ${date}</span><span style="text-align:right;"><span class="status-badge ${sc}">${sc}</span></span><span>📞 ${o.phone || '-'}</span><span style="text-align:right;">💵 ${total} LE</span></div><div class="order-items">${items || '<span class="muted">No items</span>'}</div></div>`;
        });
      } catch (e) {
        c.innerHTML = '<div style="text-align:center;padding:60px 20px;"><h3 style="color:var(--pink4);">Error loading orders</h3><p style="color:#a37588;">Please try again later.</p></div>';
      }
    }

    loadMyOrders();
  </script></body>
</html>
